[package]
name = "zsh-flex-history-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"

[lib]
name = "_flex_match"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py39"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
